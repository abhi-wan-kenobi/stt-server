<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STT Server — Live Processing</title>
<style>
  :root { --bg:#0c1211; --panel:#121a19; --line:#233130; --ink:#e4ecec; --dim:#8aa0a1; --accent:#4fc3cf; --ok:#4bbd5f; --stall:#f0666d; --idle:#6f8385; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px}
  h1{font-size:16px;letter-spacing:.04em;margin:0;font-weight:650}
  h1 span{color:var(--accent)}
  .updated{margin-left:auto;color:var(--dim);font-size:12px}
  .placeholder{color:var(--dim);padding:40px 0;text-align:center}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>STT Server · <span>Live Processing</span></h1>
    <div class="updated" id="updated">connecting…</div>
  </header>
  <p class="placeholder">Live throughput graph + session table + GPU util.<br>TODO(port) from notare-stt dashboard.html (156 lines) + the /api/metrics + GPU-util extensions.</p>
</div>
<script>
fetch("/api/sessions",{cache:"no-store"}).then(r=>r.json()).then(()=>{}).catch(()=>{});
</script>
</body>
</html>
