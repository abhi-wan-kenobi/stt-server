name: images

# Publishes stt-server multi-variant container images to GHCR:
#   ghcr.io/abhi-wan-kenobi/stt-server:{cpu,vulkan,cuda}-<ver>  (immutable)
#   ghcr.io/abhi-wan-kenobi/stt-server:{cpu,vulkan,cuda}        (moving)
#   ghcr.io/abhi-wan-kenobi/stt-server:latest                   (newest stable)
#
# Matrix is cpu / vulkan / cuda. ROCm is NOT shipped — Vulkan is the AMD path
# (the ROCm experiment was ~40% slower on large-turbo and reverted; see
# docs/architecture.md). Runs on release tags + on demand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: dev). Release runs use the git tag."
        type: string
        default: dev

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/stt-server

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, vulkan, cuda]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free disk space
        if: matrix.variant == 'cuda'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          large-packages: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAGS="${IMAGE}:${{ matrix.variant }}-${VERSION},${IMAGE}:${{ matrix.variant }}"
          # On a release tag, also point :latest at the newest stable.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ matrix.variant }}" = "vulkan" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/stt-server/Dockerfile.${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=stt-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=stt-${{ matrix.variant }}
          provenance: false